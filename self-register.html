<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Sign Up | CarePoint</title>
  <link rel="icon" href="assets/images/healthcare_favicon.svg"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"/>
  <link rel="stylesheet" href="assets/css/style.css"/>
  <style>
    .signup-card {
      max-width: 500px;
    }
    .signup-card .login-brand {
      justify-content: center;
    }
    .signup-heading {
      text-align: center;
      margin-bottom: 16px;
    }
    .signup-heading h1 {
      color: var(--eksu-text);
      font-size: 21px;
      letter-spacing: 0.4px;
      margin-bottom: 5px;
    }
    .signup-heading h2 {
      color: var(--eksu-red);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 700;
    }
    .signup-notice {
      background: var(--eksu-label-bg);
      border: 1px solid var(--eksu-border);
      border-left: 4px solid var(--eksu-red);
      padding: 12px 14px;
      color: var(--eksu-text);
      font-size: 12px;
      line-height: 1.55;
      margin-bottom: 16px;
    }
    .signup-notice strong {
      display: block;
      margin-bottom: 3px;
      font-size: 13px;
    }
    .signup-field {
      margin-bottom: 12px;
    }
    .signup-field label {
      display: block;
      color: var(--eksu-text);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
    }
    .signup-field input {
      width: 100%;
      border: 1px solid var(--eksu-border);
      border-radius: 4px;
      padding: 11px 12px;
      font-family: inherit;
      font-size: 14px;
      color: var(--eksu-text);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .signup-field input:focus {
      border-color: var(--eksu-teal);
      box-shadow: 0 0 0 2px rgba(37,99,235,0.12);
    }
    .signup-field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .terms-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      color: var(--eksu-muted);
      font-size: 11px;
      line-height: 1.45;
      margin: 14px 0;
    }
    .terms-row input {
      margin-top: 2px;
      accent-color: var(--eksu-red);
      flex-shrink: 0;
    }
    .captcha-box {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--eksu-border);
      background: #fafcfc;
      border-radius: 4px;
      padding: 11px 12px;
      color: var(--eksu-muted);
      font-size: 12px;
      margin-bottom: 16px;
    }
    .captcha-box input {
      width: 17px;
      height: 17px;
      accent-color: var(--eksu-teal);
    }
    .signup-links {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
      font-size: 12px;
    }
    .signup-links a {
      color: var(--eksu-red);
      font-weight: 600;
    }
    .signup-links a:last-child {
      color: var(--eksu-muted);
    }
    .signup-powered {
      text-align: center;
      color: var(--eksu-muted);
      font-size: 10px;
      margin-top: 18px;
    }
    @media (max-width: 520px) {
      .signup-field-row {
        grid-template-columns: 1fr;
        gap: 0;
      }
    }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-bg"></div>
    <div class="login-bg-overlay"></div>

    <div class="login-card signup-card">
      <div class="login-brand">
        <a href="index.html">
          <img src="assets/images/healthcare_logo.svg" alt="CarePoint Health Centre"/>
        </a>
      </div>

      <div class="login-body">
        <div class="signup-heading">
          <h1>SIGN UP</h1>
          <h2>Student Health Portal</h2>
        </div>

        <div class="signup-notice">
          <strong><i class="fa fa-info-circle"></i> Notice:</strong>
          Sign up with your information exactly as shown on your school record.
          Your health-centre details and appointment are completed after you sign in.
        </div>

        <div id="signup-alert" style="display:none;margin-bottom:12px"></div>

        <div class="signup-field-row">
          <div class="signup-field">
            <label for="signup-surname">Surname</label>
            <input id="signup-surname" type="text" autocomplete="family-name" placeholder="Surname"/>
          </div>
          <div class="signup-field">
            <label for="signup-first-name">First Name</label>
            <input id="signup-first-name" type="text" autocomplete="given-name" placeholder="First name"/>
          </div>
        </div>

        <div class="signup-field">
          <label for="signup-other-name">Other Name</label>
          <input id="signup-other-name" type="text" autocomplete="additional-name" placeholder="Other name (optional)"/>
        </div>

        <div class="signup-field">
          <label for="signup-matric">Matric No.</label>
          <input id="signup-matric" type="text" autocomplete="username" maxlength="20" placeholder="e.g. STU/2023/0001"/>
        </div>

        <div class="signup-field-row">
          <div class="signup-field">
            <label for="signup-email">Valid Email</label>
            <input id="signup-email" type="email" autocomplete="email" placeholder="you@example.com"/>
          </div>
          <div class="signup-field">
            <label for="signup-email-confirm">Confirm Email</label>
            <input id="signup-email-confirm" type="email" autocomplete="email" placeholder="Repeat email"/>
          </div>
        </div>

        <div class="signup-field-row">
          <div class="signup-field">
            <label for="signup-password">Password</label>
            <input id="signup-password" type="password" autocomplete="new-password" maxlength="15" placeholder="Create a password"/>
          </div>
          <div class="signup-field">
            <label for="signup-password-confirm">Confirm Password</label>
            <input id="signup-password-confirm" type="password" autocomplete="new-password" placeholder="Repeat password"/>
          </div>
        </div>

        <label class="terms-row">
          <input id="signup-terms" type="checkbox"/>
          <span>I agree to the terms and conditions guiding the use of this site.</span>
        </label>


        <button class="btn btn-red btn-block" onclick="createStudentAccount()">
          <i class="fa fa-user-plus"></i> Create
        </button>

        <div class="signup-links">
          <a href="index.html">Login</a>
          <a href="index.html">Reset Password</a>
        </div>

        <div class="signup-powered">Powered by CarePoint Health Centre</div>
      </div>

      <div class="login-footer">CarePoint Smart Health Centre Management System &copy; 2026</div>
    </div>
  </div>

  <script src="assets/js/app.js"></script>
  <script>
    seedData();

    function createStudentAccount() {
      const surname       = document.getElementById('signup-surname').value.trim();
      const firstName     = document.getElementById('signup-first-name').value.trim();
      const otherName     = document.getElementById('signup-other-name').value.trim();
      const matric        = document.getElementById('signup-matric').value.trim().toUpperCase();
      const email         = document.getElementById('signup-email').value.trim().toLowerCase();
      const emailConfirm  = document.getElementById('signup-email-confirm').value.trim().toLowerCase();
      const password      = document.getElementById('signup-password').value;
      const passwordCheck = document.getElementById('signup-password-confirm').value;
      const alert         = document.getElementById('signup-alert');

      if (!surname || !firstName || !matric || !email || !emailConfirm || !password || !passwordCheck) {
        showSignupAlert(alert, 'danger', 'Please complete all required fields.');
        return;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showSignupAlert(alert, 'danger', 'Please enter a valid email address.');
        return;
      }
      if (email !== emailConfirm) {
        showSignupAlert(alert, 'danger', 'The email addresses do not match.');
        return;
      }
      if (password.length < 6) {
        showSignupAlert(alert, 'danger', 'Password must be at least 6 characters.');
        return;
      }
      if (password !== passwordCheck) {
        showSignupAlert(alert, 'danger', 'The passwords do not match.');
        return;
      }
      if (!document.getElementById('signup-terms').checked) {
        showSignupAlert(alert, 'warning', 'Please agree to the terms and conditions.');
        return;
      }
      if (!document.getElementById('signup-captcha').checked) {
        showSignupAlert(alert, 'warning', 'Please complete the reCAPTCHA check.');
        return;
      }

      const patients = Store.get('hcms_patients', []);
      const authUsers = Store.get('hcms_students_auth', []);
      const alreadyRegistered = patients.some(p => p.matric.toLowerCase() === matric.toLowerCase()) ||
        authUsers.some(u => u.matric.toLowerCase() === matric.toLowerCase());

      if (alreadyRegistered) {
        showSignupAlert(alert, 'warning', `Matric number <strong>${matric}</strong> is already registered. <a href="student-portal.html" style="color:inherit;text-decoration:underline">Login to your portal →</a>`);
        return;
      }

      const patientId = Store.nextId('hcms_patients');
      const fullName = [surname, firstName, otherName].filter(Boolean).join(' ');
      patients.push({
        id: patientId,
        matric,
        name: fullName,
        surname,
        firstName,
        otherName,
        email,
        registeredOn: today(),
        selfRegistered: true,
        profileComplete: false,
        cardNo: `HC-${matric.replace(/[^0-9]/g, '').slice(-8) || patientId}`,
        cardIssued: false
      });
      Store.set('hcms_patients', patients);

      if (!StudentAuth.register(matric, password, patientId)) {
        patients.pop();
        Store.set('hcms_patients', patients);
        showSignupAlert(alert, 'danger', 'This student account already exists. Please use the login page.');
        return;
      }

      window.location.href = 'index.html?registered=1';
    }

    function showSignupAlert(el, type, msg) {
      el.style.display = 'flex';
      el.className = `alert alert-${type}`;
      const icons = { danger:'fa-times-circle', warning:'fa-exclamation-triangle', success:'fa-check-circle', info:'fa-info-circle' };
      el.innerHTML = `<i class="fa ${icons[type] || icons.info}"></i> <div>${msg}</div>`;
    }
  </script>
</body>
</html>
