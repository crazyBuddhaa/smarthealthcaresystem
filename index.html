<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In | CarePoint Smart Health Centre Management System</title>
  <link rel="icon" href="assets/images/healthcare_favicon.svg"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"/>
  <link rel="stylesheet" href="assets/css/style.css"/>
  <style>
    .shared-login-card {
      max-width: 500px;
    }
    .shared-login-card .login-brand {
      justify-content: center;
      padding-right: 0cm;
    }
    .shared-login-card .login-body {
      padding: 22px 24px 18px;
    }
    .login-notice-copy p {
      margin-top: 6px;
    }
    .login-notice-copy p:first-of-type {
      margin-top: 0;
    }

    .notice-content{
      color: white;
    }

    .notice-box{
      background-color: teal;

    }

    .login-captcha {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--eksu-border);
      background: #fafcfc;
      border-radius: 4px;
      padding: 11px 12px;
      color: var(--eksu-muted);
      font-size: 12px;
      margin-top: 12px;
    }
    .login-captcha input {
      width: 17px;
      height: 17px;
      accent-color: var(--eksu-teal);
      flex-shrink: 0;
    }
    .login-captcha strong {
      color: var(--eksu-text);
      font-size: 12px;
    }
    .shared-login-links {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
      font-size: 12px;
      text-align: center;
    }
    .shared-login-links a {
      flex: 1;
      color: var(--eksu-red);
      font-weight: 600;
    }
    .shared-login-links a:last-child {
      color: var(--eksu-muted);
    }
    .new-student-link {
      display: block;
      text-align: center;
      border-top: 1px solid var(--eksu-border);
      margin-top: 18px;
      padding-top: 15px;
      color: var(--eksu-muted);
      font-size: 12px;
    }
    .new-student-link a {
      color: var(--eksu-red);
      font-weight: 700;
    }

    .login-brand-title {
      text-align: left;
      display: inline-block;
    }

  

  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-bg"></div>
    <div class="login-bg-overlay"></div>

    <div class="login-card shared-login-card">
      <div class="login-brand">
        <a href="index.html">
          <img src="assets/images/healthcare_logo.svg" alt="CarePoint Health Centre"/>
        </a>
        <div class="login-brand-title">
          <i class="fa fa-lock"></i> 
        </div>
      </div>

      <div class="login-body">
        <div class="notice-box">
          <div class="notice-icon">
            <i class="fa fa-info-circle"></i>
          </div>
          <div class="notice-content login-notice-copy">
            <h5>Notice:</h5>
            <p>
              <span class="badge-pill badge-student">STUDENT</span>
              Enter your Matric Number as Username and the password created during student sign-up.
            </p>
            <p>
              <span class="badge-pill badge-staff">STAFF</span>
              Enter your Staff ID as Username and your assigned password.
            </p>
           
          </div>
        </div>

        <div id="login-alert" style="display:none;margin-bottom:12px"></div>

        <form id="login-form" onsubmit="doLogin(event)">
          <div class="field-group">
            <div class="field-label">
              <i class="fa fa-user"></i> MATRIC NO
            </div>
            <input type="text" id="username" placeholder="Enter your username" autocomplete="username" maxlength="20" required/>
          </div>

          <div class="field-group">
            <div class="field-label">
              <i class="fa fa-key"></i> PASSWORD
            </div>
            <input type="password" maxlength="15" id="password" placeholder="Enter your password" autocomplete="current-password" required/>
            <button type="button" class="field-group-icon" onclick="togglePwd()" aria-label="Show or hide password">
              <i class="fa fa-eye" id="pwd-eye" style="color: black;"></i>
            </button>
          </div>

        <label class="login-captcha">
          <input id="login-captcha" type="checkbox"/>
          <span>I agree to the terms and conditions guiding the use of this site.</span>
        </label>

          <button type="submit" class="btn btn-red btn-block" style="margin-top:12px">
            LOGIN <i class="fa fa-sign-in"></i>
          </button>
        </form>

        <div class="shared-login-links">
          <button class="btn btn-gray" style="flex:1" onclick="toast('Password reset is not available in demo mode.','warning')">
            <i class="fa fa-key"></i> Reset Password
          </button>
          <a href="index.html"  id="i-text"  class="btn btn-white">
            Homepage <i class="fa fa-home"></i>
          </a>
        </div>

        <div class="new-student-link">
          New student? <a href="self-register.html">Create an account</a>
        </div>

        <div class="login-footer">
          CarePoint Smart Health Centre Management System &copy; 2026
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/app.js"></script>
  <script>
    seedData();

    if (Auth.current()) {
      window.location.href = 'dashboard.html';
    } else if (StudentAuth.current()) {
      window.location.href = 'student-portal.html';
    }

    const registered = new URLSearchParams(window.location.search).get('registered');
    if (registered === '1') {
      showLoginAlert('success', 'Your student account has been created. Sign in to complete your Health Centre registration.');
    }

    function doLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!document.getElementById('login-captcha').checked) {
        showLoginAlert('warning', 'Please complete the reCAPTCHA check.');
        return;
      }

      const staff = Auth.login(username, password);
      if (staff) {
        window.location.href = 'dashboard.html';
        return;
      }

      const student = StudentAuth.login(username, password);
      if (student) {
        window.location.href = 'student-portal.html';
        return;
      }

      showLoginAlert('danger', 'Invalid username or password. Please try again.');
    }

    function togglePwd() {
      const input = document.getElementById('password');
      const eye = document.getElementById('pwd-eye');
      if (input.type === 'password') {
        input.type = 'text';
        eye.className = 'fa fa-eye-slash';
      } else {
        input.type = 'password';
        eye.className = 'fa fa-eye';
      }
    }

    function showLoginAlert(type, message) {
      const alert = document.getElementById('login-alert');
      const icons = {
        danger: 'fa-times-circle',
        warning: 'fa-exclamation-triangle',
        success: 'fa-check-circle',
        info: 'fa-info-circle'
      };
      alert.style.display = 'flex';
      alert.className = `alert alert-${type}`;
      alert.innerHTML = `<i class="fa ${icons[type] || icons.info}"></i><div>${message}</div>`;
    }
  </script>
</body>
</html>
